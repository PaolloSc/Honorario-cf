name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Banco descartavel para os testes que precisam de Postgres de verdade
      # (o resto roda em SQLite, que aceita boolean = 1).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest httpx

      - name: Lint (syntax check)
        run: python -m py_compile app/main.py

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          TESTING: "true"
          AZURE_TENANT_ID: "test"
          AZURE_CLIENT_ID: "test"
          AZURE_CLIENT_SECRET: "test"
          AZURE_SENDER_EMAIL: "test@test.com"
          DOCUSEAL_API_KEY: "test"
          TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          AUTH_SECRET: "ci-test-secret-not-used-in-production"
          AUTH_URL: http://localhost:3000
