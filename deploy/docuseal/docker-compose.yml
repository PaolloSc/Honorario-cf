# DocuSeal auto-hospedado (produção) — https://www.docuseal.com/docs/install
#
# Uso:
#   cp .env.example .env   # preencher HOST, SECRET_KEY_BASE, POSTGRES_PASSWORD e SMTP
#   docker compose up -d
#
# O Caddy emite HTTPS automaticamente (Let's Encrypt) para o domínio em $HOST —
# aponte o DNS do domínio para este servidor antes de subir.
services:
  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=${HOST}
      - FORCE_SSL=true
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DATABASE_URL=postgresql://docuseal:${POSTGRES_PASSWORD}@postgres:5432/docuseal
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_AUTHENTICATION=plain
    volumes:
      - docuseal_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=docuseal
      - POSTGRES_USER=docuseal
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from https://${HOST} --to http://docuseal:3000
    volumes:
      - caddy_data:/data

volumes:
  docuseal_data:
  postgres_data:
  caddy_data:
