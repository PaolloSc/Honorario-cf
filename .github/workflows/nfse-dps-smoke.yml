name: nfse-dps-smoke

# Smoke test: monta, assina e envia 1 DPS ao SEFIN Nacional, PRODUCAO RESTRITA
# (host fixo em backend/workers/nfse_dps_smoke/run.py, sem opcao de producao).
# So dispara a mao. A saida tem so o status HTTP, a chave de acesso ou os
# codigos de rejeicao.
on:
  workflow_dispatch:
    inputs:
      cnpj:
        description: 'CNPJ do prestador (o do certificado)'
        default: '25463159000173'
      serie:
        description: 'Serie da DPS'
        default: '900'
      ndps:
        description: 'Numero da DPS (vazio = segundos desde 1970, nao repete)'
        required: false
      op_simp_nac:
        description: '1 nao optante, 2 MEI, 3 ME/EPP (pergunte ao contador)'
        default: '1'
      reg_ap_trib_sn:
        description: 'Regime de apuracao do SN, so ME/EPP (op_simp_nac=3): 1 tudo pelo SN, 2 ou 3 ISS fora do SN. Vazio = 1'
        required: false
      tp_ret_issqn:
        description: 'ISS retido? 1 nao, 2 pelo tomador, 3 pelo intermediario. ME/EPP pelo SN com retido exige aliquota (min 1.80); sem retencao nao pode ter aliquota'
        default: '1'
      p_tot_trib_sn:
        description: 'So ME/EPP - percentual aproximado de tributos do SN (ex 6.00)'
        default: '0'
      reg_esp_trib:
        description: 'Regime especial (0 nenhum, 6 sociedade de profissionais)'
        default: '0'
      c_trib_nac:
        description: 'Codigo de tributacao nacional (6 digitos; 17.14 advocacia = 171401)'
        default: '171401'
      aliquota_iss:
        description: 'Aliquota de ISS em % (ex 2.00; vazio = nao informa)'
        required: false
      c_trib_mun:
        description: 'Codigo de tributacao municipal, 3 digitos (ex 001 na NF2026.752); vazio = nao informa'
        required: false
      competencia:
        description: 'Competencia AAAA-MM-DD (vazio = hoje, Brasilia)'
        required: false
      consulta:
        description: 'So le os parametros municipais (convenio, aliquota, regimes, retencoes) do ADN em producao restrita; nao monta nem envia DPS'
        type: boolean
        default: false
      im:
        description: 'Inscricao municipal do prestador (E0116 se faltar; nao ha padrao)'
        required: false
      nbs:
        description: 'Codigo NBS do servico, 9 digitos sem pontos (E0322 com IBS/CBS; nao ha padrao). Advocacia, item 17.14, correlacao Anexo VIII v1.0.0 - 113011000 (criminal), 113012000 (outras areas, exceto consultoria tributaria), 113019000 (nao classificados); confirmar com o contador'
        required: false
      ibscbs:
        description: 'Incluir o grupo IBS/CBS'
        type: boolean
        default: true
      assinatura:
        description: 'Perfil da assinatura (sha256 ou sha1)'
        default: sha256
        type: choice
        options: [sha256, sha1]
      valor:
        description: 'Valor do servico (padrao 1.00)'
        default: '1.00'
      tomador_cpf:
        description: 'CPF do tomador (11 digitos); vazio = CNPJ de teste'
        required: false
      descricao:
        description: 'xDescServ; vazio = texto de teste sem acento'
        required: false
      ver_aplic:
        description: 'verAplic; vazio = padrao do smoke'
        required: false
      dry_run:
        description: 'So monta e assina, nao envia'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nfse-dps-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/workers/nfse_dps_smoke/requirements.txt'

      - run: pip install -r backend/workers/nfse_dps_smoke/requirements.txt

      - name: Enviar 1 DPS (producao restrita)
        working-directory: backend
        env:
          NFSE_CERT_PFX_B64: ${{ secrets.NFSE_CERT_PFX_B64 }}
          NFSE_CERT_PFX_SENHA: ${{ secrets.NFSE_CERT_PFX_SENHA }}
          # Entradas passam por env, nunca interpoladas no script (injecao de comando).
          CNPJ: ${{ inputs.cnpj }}
          SERIE: ${{ inputs.serie }}
          NDPS: ${{ inputs.ndps }}
          OP_SIMP_NAC: ${{ inputs.op_simp_nac }}
          REG_ESP_TRIB: ${{ inputs.reg_esp_trib }}
          REG_AP_TRIB_SN: ${{ inputs.reg_ap_trib_sn }}
          TP_RET_ISSQN: ${{ inputs.tp_ret_issqn }}
          P_TOT_TRIB_SN: ${{ inputs.p_tot_trib_sn }}
          C_TRIB_NAC: ${{ inputs.c_trib_nac }}
          ALIQUOTA_ISS: ${{ inputs.aliquota_iss }}
          IM: ${{ inputs.im }}
          C_TRIB_MUN: ${{ inputs.c_trib_mun }}
          COMPETENCIA: ${{ inputs.competencia }}
          CONSULTA: ${{ inputs.consulta }}
          NBS: ${{ inputs.nbs }}
          IBSCBS: ${{ inputs.ibscbs }}
          ASSINATURA: ${{ inputs.assinatura }}
          VALOR: ${{ inputs.valor }}
          TOMADOR_CPF: ${{ inputs.tomador_cpf }}
          DESCRICAO: ${{ inputs.descricao }}
          VER_APLIC: ${{ inputs.ver_aplic }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--cnpj "$CNPJ" --serie "$SERIE" --op-simp-nac "$OP_SIMP_NAC" --reg-esp-trib "$REG_ESP_TRIB" \
                --c-trib-nac "$C_TRIB_NAC" --assinatura "$ASSINATURA")
          [ -n "$REG_AP_TRIB_SN" ] && ARGS+=(--reg-ap-trib-sn "$REG_AP_TRIB_SN")
          ARGS+=(--tp-ret-issqn "$TP_RET_ISSQN" --p-tot-trib-sn "$P_TOT_TRIB_SN")
          [ -n "$NDPS" ] && ARGS+=(--ndps "$NDPS")
          [ -n "$C_TRIB_MUN" ] && ARGS+=(--c-trib-mun "$C_TRIB_MUN")
          [ -n "$COMPETENCIA" ] && ARGS+=(--competencia "$COMPETENCIA")
          [ "$CONSULTA" = "true" ] && ARGS+=(--consulta)
          [ -n "$IM" ] && ARGS+=(--im "$IM")
          [ -n "$NBS" ] && ARGS+=(--nbs "$NBS")
          [ -n "$ALIQUOTA_ISS" ] && ARGS+=(--aliquota-iss "$ALIQUOTA_ISS")
          [ "$IBSCBS" = "false" ] && ARGS+=(--sem-ibscbs)
          ARGS+=(--valor "$VALOR")
          [ -n "$TOMADOR_CPF" ] && ARGS+=(--tomador-cpf "$TOMADOR_CPF")
          [ -n "$DESCRICAO" ] && ARGS+=(--descricao "$DESCRICAO")
          [ -n "$VER_APLIC" ] && ARGS+=(--ver-aplic "$VER_APLIC")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python -m workers.nfse_dps_smoke.run "${ARGS[@]}"
